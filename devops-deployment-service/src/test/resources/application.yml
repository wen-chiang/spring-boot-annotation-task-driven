management:
  security:
    enabled: false
  endpoint:
    build:
      enabled: true
    live:
      enabled: true
    ready:
      enabled: true
    info:
      enabled: true
  endpoints:
    web:
      base-path: /
      exposure:
        include: 'build,live,ready,info'


artifactory:
  protocol: https
  host: artifactory.sample.com
  port: 443


---
spring:
  profiles: default

daas:
  ssl:
    enabled: false
    key-store: "${user.dir}/../secret/keystore.p12"
    key-store-password: "changeit"
    trust-store: "${user.dir}/../secret/cacerts.jks"
    trust-store-password: "changeit"
    key-password: "changeit"
    key-alias: "prod_token_api"

common:
  routine:
    artifactory:
      root: "https://artifactory.sample.com"
    fortify:
      url:  "http://aspnetsrv.rails.rwy.sample.com/FortifyRestAPI/api/SecurityIssue"
      vulnerability:
        url:  "http://aspnetsrv.rails.rwy.sample.com/FortifyRestApi/api/SecurityIssue"

procedure:
  chef:
    chefApi:
      url:
        root: "https://sample-chef-api-dev.devops.oapp-top01.sample.com/"
  ansible:
    ansibleApi:
      url:
        root: "https://sample-ansible-api-dev.devops-nonprod.sample.com/"

